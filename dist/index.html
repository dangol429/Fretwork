    <!-- Everything between these two comments is per-page: the homepage's own
         tags as written here, and the prerender script (scripts/prerender.mjs)
         replaces the whole block with a chord's own when it writes that
         chord's static file, using the same PageMeta shape src/seo/head.ts
         renders for a client-side navigation. Never append a second copy
         alongside this one — replace it, or document.title (and a crawler
         reading raw HTML) will see the first, wrong, tag. -->
    <!-- page-meta:start -->
    <meta
      name="description"
      content="Look up any guitar chord and see every way to play it — every voicing up the neck, easiest first, with capo and substitute shapes when the chord is hard."
    />
    <link rel="canonical" href="https://fretworkforguitar.com" />
    <title>Fretwork — every way to play every guitar chord</title>

    <meta property="og:site_name" content="Fretwork" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Fretwork — every way to play every guitar chord" />
    <meta
      property="og:description"
      content="Look up any guitar chord and see every way to play it."
    />
    <meta property="og:url" content="https://fretworkforguitar.com" />
    <meta property="og:image" content="https://fretworkforguitar.com/og-default.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Fretwork — every way to play every guitar chord" />
    <meta
      name="twitter:description"
      content="Look up any guitar chord and see every way to play it."
    />
    <!-- page-meta:end -->

    <!-- Resolve the theme before the first paint: a stored choice if there is
         one, the OS preference otherwise. Inline and synchronous on purpose —
         anything deferred would let a light frame flash in a dark room.
         The key is shared with src/hooks/useTheme.ts. -->
    <script>
      (function () {
        var theme = "light";
        try {
          var stored = localStorage.getItem("fretwork-theme");
          theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
        } catch (error) {
          /* No storage (private mode): fall back to light. */
        }
        document.documentElement.dataset.theme = theme;
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute("content", theme === "dark" ? "#17130f" : "#f0ede8");
      })();
    </script>

    <!-- Fonts: preconnect, then a stylesheet parked on the print media type
         until it has loaded — the standard way to say "fetch this, but do not
         hold up the render for it". Every face is served font-display: swap, so
         text is readable in the fallback stack from the first frame and re-sets
         when the real face lands; nothing is ever invisible waiting on one.

         These are still Google's rather than ours. Self-hosting them was tried
         and measured: same-origin the font bytes contend with the app bundle
         over a throttled connection, and first contentful paint went from ~1.3s
         to ~1.9s. Two extra handshakes buy back more than they cost here.

         The axis ranges are pinned to what the design actually asks for rather
         than to the whole family design space — including weight 600, which the
         capo fret number uses and the old request did not cover. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@20..144,400..600,20..34,1&family=Italianno&family=Work+Sans:wght@350..600&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@20..144,400..600,20..34,1&family=Italianno&family=Work+Sans:wght@350..600&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@20..144,400..600,20..34,1&family=Italianno&family=Work+Sans:wght@350..600&display=swap" /></noscript>
