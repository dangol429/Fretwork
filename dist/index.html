    <meta name="theme-color" content="#f0ede8" />
    <meta
      name="description"
      content="Fretwork — look up any guitar chord and see every way to play it."
    />
    <title>Fretwork — every way to play every chord</title>

    <!-- Resolve the theme before the first paint: a stored choice if there is
         one, the OS preference otherwise. Inline and synchronous on purpose —
         anything deferred would let a light frame flash in a dark room.
         The key is shared with src/hooks/useTheme.ts. -->
    <script>
      (function () {
        var theme = "light";
        try {
          var stored = localStorage.getItem("fretwork-theme");
          theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
        } catch (error) {
          /* No storage (private mode): fall back to light. */
        }
        document.documentElement.dataset.theme = theme;
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute("content", theme === "dark" ? "#17130f" : "#f0ede8");
      })();
    </script>

    <!-- Fonts: preconnect + non-blocking stylesheet swap, so first paint never waits on them. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
